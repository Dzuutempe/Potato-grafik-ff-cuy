name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun struktur project
        run: |
          mkdir -p app/src/main/java/com/potato/ffpatcher app/src/main/res/values app/src/main/res/drawable
          mv app-build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.kt PatchEngine.kt app/src/main/java/com/potato/ffpatcher/
          mv strings.xml themes.xml app/src/main/res/values/
          mv ic_launcher.xml app/src/main/res/drawable/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PotatoPatcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
